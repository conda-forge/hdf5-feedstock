{% set version = "2.2.0" %}
{% set maj_min_patch_ver = "_".join(version.split(".")) %}
{% set maj_min_ver = "_".join(version.split(".")[:2]) %}
{% set build = 0 %}

# recipe-lint fails if mpi is undefined
{% set mpi = mpi or 'nompi' %}
{% if mpi == "nompi" %}
# prioritize nompi via build number
{% set build = build + 100 %}
{% endif %}

{% if mpi != "nompi" %}
{% set mpi_prefix = "mpi_" + mpi %}
{% else %}
{% set mpi_prefix = "nompi" %}
{% endif %}
# add build string so packages can depend on
# mpi or nompi variants
# dependencies:
# `hdf5 * mpi_mvapich_*` for mvapich
# `hdf5 * mpi_mpich_*` for mpich
# `hdf5 * mpi_*` for any mpi
# `hdf5 * nompi_*` for no mpi

# mpi builds require the right mpi
# non-mpi builds *do not* appear to require non-mpi builds
# at least not always

{% if mpi != 'nompi' %}
{% set build_pin = mpi_prefix + '_*' %}
{% else %}
{% set build_pin = '' %}
{% endif %}

package:
  name: hdf5
  version: {{ version }}

source:
  # url: https://github.com/HDFGroup/hdf5/releases/download/{{ version }}/hdf5-{{ version }}.tar.gz
  url: https://github.com/jhendersonHDF/hdf5/archive/fix_package_config_file_issues.tar.gz
  sha256: 42daf4ebd4a4560c1517d3af3c94ec617a400e8996b0f39cdda41fd703433657
  patches:
    # Still open upstream as of 2.2.0; rebased onto the reworked filter
    # handling from https://github.com/HDFGroup/hdf5/pull/6287.
    # This matters more in 2.2.0 than it did in 2.1.0: HDF5_USE_GNU_DIRS now
    # defaults to ON on non-Windows, so hdf5-config.cmake lands in
    # $PREFIX/lib/cmake/hdf5 where CMake actually looks for it, which means
    # the find_dependency() calls now really do run for downstream consumers.
    # https://github.com/HDFGroup/hdf5/issues/6347
    # - 6347-static-find-dependency.patch

build:
  number: {{ build }}
  string: {{ mpi_prefix }}_h{{ PKG_HASH }}_{{ build }}
  run_exports:
    - {{ pin_subpackage('hdf5', max_pin='x') }} {{ build_pin }}
  ignore_run_exports:
    - libacl
  script_env:
    # this avoids hangs and delays with mpich on CI
    - FI_PROVIDER=tcp  # [unix]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - cmake
    - ninja
    - {{ mpi }}  # [build_platform != target_platform and mpi != 'nompi']
    # Keep both versions of openssl in sync
    - openssl
    - diffutils   # [linux]
    - pkg-config
  host:
    - {{ mpi }}   # [mpi != 'nompi' and mpi != 'impi']
    - impi-devel  # [mpi == 'impi']
    - zlib
    - libaec
    - libacl      # [linux]
    - libcurl
    - openssl
    - aws-c-io
    - aws-c-s3
    - aws-c-auth
    - aws-c-http
    - aws-c-common
    - aws-c-sdkutils

test:
  requires:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}  # [not win]
    - pkg-config                 # [not win]
    - cmake                      # [not win]
    - make                       # [not win]
    # ensure new libgfortran is co-installable; in July 2025, there were resolution errors
    # with hdfs5 depending on `libgfortran =5` (either real or hallucinated). This check can
    # be dropped again in 1-3 years if the issue does not keep recurring in the meantime.
    - libgfortran5 >=13.3.0      # [not win]
  files:
    - test
  commands:
    # Verify UNIX CLI tools.
    {% if mpi == 'nompi' %}
    {% set h5_compilers = [
        "h5c++",
        "h5cc",
        "h5fc",
    ] %}
    {% else %}
    # no p on parallel h5c++!
    {% set h5_compilers = [
        "h5c++",
        "h5pcc",
        "h5pfc",
    ] %}
    {% endif %}
    {% set hdf5_unix_cmds = h5_compilers %}
    {% if build_platform == target_platform %}
    {% set hdf5_unix_cmds = hdf5_unix_cmds + [
        "h5perf_serial",
    ] %}
    {% endif %}
    {% for each_hdf5_unix_cmd in hdf5_unix_cmds %}
    - command -v {{ each_hdf5_unix_cmd }}   # [not win]
    {% endfor %}
    # Verify CLI tools.
    {% set hdf5_cmds = [
        "h5copy",
        "h5debug",
        "h5diff",
        "h5dump",
        "h5import",
        "h5jam",
        "h5ls",
        "h5mkgrp",
        "h5repack",
        "h5repart",
        "h5stat",
        "h5unjam",
    ] %}
    {% if mpi != 'nompi' %}
    {% set hdf5_cmds = hdf5_cmds + [
        "ph5diff",
    ] %}
    {% endif %}
    {% for each_hdf5_cmd in hdf5_cmds %}
    - command -v {{ each_hdf5_cmd }}  # [not win]
    - where {{ each_hdf5_cmd }}  # [win]
    {% endfor %}
    # Verify libraries.
    {% set hdf5_libs = [
        "hdf5",
        "hdf5_cpp",
        "hdf5_hl",
        "hdf5_hl_cpp"
    ] %}
    {% for each_hdf5_lib in hdf5_libs %}
    - test -f $PREFIX/lib/lib{{ each_hdf5_lib }}${SHLIB_EXT}  # [not win]
    - if not exist %PREFIX%\\Library\\lib\\{{ each_hdf5_lib }}.lib exit 1  # [win]
    - if not exist %PREFIX%\\Library\\bin\\{{ each_hdf5_lib }}.dll exit 1  # [win]
    {% endfor %}
    # Check ros3 driver
    - AWS_REGION=us-east-2 h5dump --filedriver=ros3 "https://s3.amazonaws.com/hdfgroup/data/hdf5demo/tall.h5" | grep '^HDF5'  # [unix]
    # Jan 2023 -- hmaarrfk. Tests will fail on windows without --s3-cred specified
    # https://github.com/HDFGroup/hdf5/issues/2406
    #- h5dump --filedriver=ros3 --s3-cred="(,,)" "https://s3.amazonaws.com/hdfgroup/data/hdf5demo/tall.h5" | findstr "^HDF5"  # [win]

about:
  home: https://www.hdfgroup.org/solutions/hdf5/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: HDF5 is a data model, library, and file format for storing and managing data
  dev_url: https://github.com/HDFGroup/hdf5
  doc_url: https://support.hdfgroup.org/documentation/hdf5/latest/

extra:
  recipe-maintainers:
    - hmaarrfk
    - jakirkham
    - gillins
    - groutr
    - ocefpaf
    - astrofrog
    - marcelotrevisani
    - scopatz
    - davidbrochart
